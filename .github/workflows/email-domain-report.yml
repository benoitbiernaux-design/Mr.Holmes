name: Email Domain Report

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email address to analyze"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y whois

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fpdf2 dnspython

      - name: Generate text and PDF report
        run: |
          python tools/email_domain_report.py "${{ github.event.inputs.email }}"

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: email-domain-report
          path: artifacts/email-report/
          if-no-files-found: error
